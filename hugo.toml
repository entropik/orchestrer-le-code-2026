baseURL = 'https://savoirs.keredit.com/'
title = 'Orchestrer le code en 2026'
locale = 'fr-FR'
defaultContentLanguage = 'fr'
timeZone = 'Europe/Paris'
disableKinds = ['taxonomy', 'term', 'RSS']
enableRobotsTXT = true
refLinksErrorLevel = 'ERROR'

[params]
description = 'Des savoirs partagés pour apprendre à comprendre, vérifier et orchestrer le code avec des agents.'
repositoryURL = 'https://github.com/entropik/orchestrer-le-code-2026'

[markup.goldmark.renderer]
unsafe = false

# Préserver aussi les apostrophes, guillemets et points des textes originaux.
[markup.goldmark.extensions.typographer]
disable = true

[markup.goldmark.extensions.passthrough]
enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$'], ['\[', '\]']]
  inline = [['$', '$'], ['\(', '\)']]

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[module]
  [module.hugoVersion]
  min = '0.158.0'
  [[module.mounts]]
  source = 'static'
  target = 'static'
  [[module.mounts]]
  source = 'sources/originaux'
  target = 'static/sources'
