baseURL = 'http://localhost:1313/'
title = 'Orchestrer le code en 2026'
locale = 'fr-FR'
defaultContentLanguage = 'fr'
timeZone = 'Europe/Paris'
disableKinds = ['taxonomy', 'term', 'RSS']
enableRobotsTXT = true
refLinksErrorLevel = 'ERROR'

[params]
description = 'Un manuel, deux lectures : comprendre pour décider, approfondir pour concevoir et vérifier.'
repositoryURL = ''

[markup.goldmark.renderer]
unsafe = false

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[module]
  [module.hugoVersion]
  min = '0.158.0'
  [[module.mounts]]
  source = 'static'
  target = 'static'
  [[module.mounts]]
  source = 'sources/originaux'
  target = 'static/sources'
