<div class="text-scale-widget" aria-label="Confort de lecture">
  <div class="text-scale-header">
    <span class="text-scale-legend" id="text-scale-lbl-{{ .id }}">Taille du texte</span>
  </div>
  <div class="text-scale-group" role="group" aria-labelledby="text-scale-lbl-{{ .id }}">
    <button type="button" class="text-scale-btn" data-scale="normal" aria-pressed="true" title="Taille standard (100 %)">
      <span class="scale-visual scale-sm" aria-hidden="true">A</span>
      <span class="scale-name">Normal</span>
    </button>
    <button type="button" class="text-scale-btn" data-scale="comfort" aria-pressed="false" title="Taille confort (+15 %)">
      <span class="scale-visual scale-md" aria-hidden="true">A</span>
      <span class="scale-name">Confort</span>
    </button>
    <button type="button" class="text-scale-btn" data-scale="large" aria-pressed="false" title="Grande taille (+30 %)">
      <span class="scale-visual scale-lg" aria-hidden="true">A</span>
      <span class="scale-name">Grand</span>
    </button>
  </div>
</div>
