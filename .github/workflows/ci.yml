name: Vérifier le manuel

on:
  push:
  pull_request:

jobs:
  verifier:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - name: Vérifier les sources et le contenu généré
        run: python -X utf8 scripts/verifier.py && python -X utf8 scripts/preparer_hugo.py --check && python -X utf8 -m unittest discover -s tests
      - name: Construire et contrôler Hugo
        run: hugo --panicOnWarning && python -X utf8 scripts/verifier_html.py public && python -X utf8 scripts/verifier_lecture_sources.py public && node --test tests/test_search.mjs
